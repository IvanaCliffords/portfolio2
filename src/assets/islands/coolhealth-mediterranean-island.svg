      <circle cx="666" cy="494" r="23"/>
      <circle cx="690" cy="502" r="20"/>
      <circle cx="807" cy="507" r="20"/>
      <circle cx="830" cy="498" r="23"/>
      <circle cx="855" cy="508" r="20"/>
