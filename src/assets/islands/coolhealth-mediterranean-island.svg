      <circle cx="384" cy="449" r="23"/>
      <circle cx="429" cy="448" r="24"/>
      <circle cx="462" cy="457" r="25"/>
      <circle cx="693" cy="435" r="19"/>
      <circle cx="718" cy="431" r="21"/>
