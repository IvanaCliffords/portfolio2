<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1200 760"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">CoolHealth Mediterranean Island</title>
  <desc id="desc">
    Cohesive flat-vector Mediterranean island with a white stucco house embedded
    into the hillside, cypress and olive trees, continuous limestone terrain,
    shrubs, a small stone terrace, a dock, and calm water.
  </desc>

  <defs>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A9BFC1"/>
      <stop offset="100%" stop-color="#788E93"/>
    </linearGradient>

    <linearGradient id="rockMain" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8C9B7"/>
      <stop offset="100%" stop-color="#C9A08D"/>
    </linearGradient>

    <linearGradient id="rockShadow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8E9195"/>
      <stop offset="100%" stop-color="#687179"/>
    </linearGradient>
  </defs>

  <!-- WATER -->
  <g id="water">
    <path
      d="M78 610
         C180 592 305 590 405 602
         C523 616 646 615 751 604
         C867 592 1000 597 1117 611
         C1083 622 1023 629 955 631
         C1007 640 1024 650 978 659
         C859 679 718 677 610 669
         C503 661 370 669 246 665
         C168 663 109 654 75 638
         C119 631 135 623 78 610Z"
      fill="url(#water)"
    />
    <path
      d="M130 629
         C257 621 360 623 455 633
         C563 644 676 641 771 631
         C868 619 964 622 1053 633"
      fill="none"
      stroke="#CFDDDE"
      stroke-width="8"
      stroke-linecap="round"
      opacity="0.5"
    />
  </g>

