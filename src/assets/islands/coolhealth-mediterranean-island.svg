  <!-- HOUSE, LOWERED INTO HILLSIDE -->
  <g id="house" transform="translate(0 20)">
    <path d="M490 357 L554 304 L635 357 Z" fill="#A86E56"/>
    <path d="M500 355 L555 312 L627 355 Z" fill="#C77B59"/>

    <rect x="503" y="355" width="122" height="92" fill="#F0E4DB"/>
    <rect x="560" y="355" width="65" height="92" fill="#F7EEE8"/>

    <rect x="526" y="381" width="21" height="38" rx="2" fill="#2D4F5C"/>
    <rect x="578" y="377" width="29" height="70" rx="2" fill="#315563"/>

    <path d="M491 357 L554 305 L636 357" fill="none" stroke="#A86E56" stroke-width="5"/>

    <g stroke="#A86E56" stroke-width="3" opacity="0.6">
      <line x1="512" y1="340" x2="531" y2="354"/>
      <line x1="532" y1="324" x2="551" y2="353"/>
      <line x1="553" y1="311" x2="574" y2="353"/>
      <line x1="577" y1="316" x2="598" y2="353"/>
      <line x1="600" y1="327" x2="620" y2="354"/>
    </g>
  </g>

  <!-- LOW STONE FOUNDATION / TERRACE: SUPPORTS THE FULL HOUSE -->
  <g id="stonework">
    <!-- The house spans x=503–625 and ends at y=467 after its translation.
         This foundation begins slightly left of the house and overlaps its base,
         so no part of the house can read as floating. -->
    <path
      d="M492 462
         H706
         V494
         C680 502 648 506 614 506
         C575 506 535 502 492 494Z"
      fill="#E2C4B1"
    />

    <!-- top cap / sill -->
    <path
      d="M492 462 H706 V470 H492Z"
      fill="#D4AF9B"
    />

    <g stroke="#F4DED1" stroke-width="3" opacity="0.95">
      <line x1="492" y1="480" x2="706" y2="480"/>
      <line x1="526" y1="462" x2="526" y2="499"/>
      <line x1="566" y1="462" x2="566" y2="504"/>
      <line x1="606" y1="462" x2="606" y2="506"/>
      <line x1="646" y1="462" x2="646" y2="504"/>
      <line x1="686" y1="462" x2="686" y2="499"/>
    </g>
  </g>

  <!-- AGAVE -->
  <g id="agave" fill="#245B59">
    <path d="M838 489 C828 450 833 422 846 395 C850 431 850 458 838 489Z"/>
    <path d="M840 489 C850 449 865 423 888 405 C873 440 862 464 840 489Z"/>
    <path d="M836 489 C813 456 803 431 805 405 C822 434 830 460 836 489Z"/>
    <path d="M842 489 C858 466 878 447 904 439 C882 462 862 478 842 489Z"/>
    <path d="M833 489 C806 472 788 452 778 431 C803 447 820 465 833 489Z"/>
  </g>

  <!-- FOREGROUND SHRUBS: HOUSE FOUNDATION HIDDEN INTO LAND -->
  <g id="front-shrubs">
    <g fill="#294F4D">
      <circle cx="458" cy="533" r="24"/>
      <circle cx="484" cy="522" r="28"/>
      <circle cx="513" cy="527" r="27"/>
      <circle cx="543" cy="535" r="25"/>
      <circle cx="572" cy="528" r="22"/>
      <circle cx="602" cy="520" r="24"/>
      <circle cx="628" cy="523" r="21"/>
