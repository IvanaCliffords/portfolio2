  <!-- DOCK CONNECTED TO TERRAIN -->
  <g id="dock">
    <rect x="704" y="566" width="207" height="15" rx="3" fill="#765047"/>
    <rect x="720" y="549" width="11" height="64" rx="2" fill="#68453F"/>
    <rect x="778" y="546" width="11" height="73" rx="2" fill="#68453F"/>
    <rect x="854" y="550" width="11" height="68" rx="2" fill="#68453F"/>
    <rect x="704" y="566" width="207" height="5" fill="#A76D55" opacity="0.88"/>

    <g opacity="0.22" fill="#27474D">
      <rect x="720" y="612" width="11" height="33" rx="2"/>
      <rect x="778" y="619" width="11" height="28" rx="2"/>
      <rect x="854" y="618" width="11" height="27" rx="2"/>
